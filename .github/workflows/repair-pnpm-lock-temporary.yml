name: Regenerate pnpm lockfile (temporary repair)
on:
  push:
    branches:
      - fix/netlify-pnpm-lock-typescript6

permissions:
  contents: write

jobs:
  repair-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/netlify-pnpm-lock-typescript6
          fetch-depth: 1

      - name: Set up Node 24 (Netlify build version)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Use the same pnpm as Netlify
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
          run_install: false

      - name: Regenerate full dependency graph
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Verify frozen installation
        run: pnpm install --frozen-lockfile

      - name: Validate application
        run: |
          pnpm run typecheck
          pnpm run test
          pnpm run build

      - name: Commit corrected lockfile
        run: |
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(lock): regenerate pnpm lock for TypeScript 6.0.2"
          git push origin HEAD:refs/heads/fix/netlify-pnpm-lock-typescript6
