name: Verificación de cambios

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  calidad:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Actualizar npm para evitar fallo de resolución Arborist en npm 10
        run: npm install -g npm@11
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Comprobar TypeScript
        run: npm run typecheck
      - name: Comprobar ESLint
        run: npm run lint
      - name: Ejecutar pruebas
        run: npm run test
      - name: Comprobar que los 264 SVG se regeneran sin diferencias
        run: |
          node scripts/regenerate-procuraduria-svgs.mjs
          git diff --exit-code -- public/media/procuraduria/module-diagrams public/media/lesson-support
      - name: Verificar 255 SVG de Procuraduría
        run: node scripts/check-procuraduria-module-svgs.mjs
      - name: Generar PWA
        run: npm run build

      - name: Instalar Chromium para la prueba de navegador
        run: npx playwright install --with-deps chromium
      - name: Validar simulacro y PWA de Procuraduría en navegador
        run: npm run e2e -- --config=playwright.pgn.config.mjs
