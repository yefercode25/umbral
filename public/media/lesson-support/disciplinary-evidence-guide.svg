<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Derecho probatorio disciplinario</title><desc id="desc">De la hipótesis a una valoración explicable y contradicha</desc>
<style>.over{font:700 16px Arial,sans-serif;letter-spacing:1px}.title{font:700 34px Arial,sans-serif}.sub{font:18px Arial,sans-serif}.head{font:700 17px Arial,sans-serif;fill:#20382E}.detail{font:16px Arial,sans-serif;fill:#53665D}.num{font:700 18px Arial,sans-serif}.small{font:700 15px Arial,sans-serif;letter-spacing:.5px}.panel{font:17px Arial,sans-serif;fill:#41594D}.foot{font:14px Arial,sans-serif;fill:#6A7C72}</style>
<rect width="1200" height="720" fill="#F7FAF8" rx="20"/><rect width="1200" height="155" fill="#EBF5EF" rx="20"/>
<text x="58" y="44" class="over" fill="#715BC0">UMBRAL / PROCURADURÍA 104-2026</text><text x="58" y="87" class="title" fill="#1D362A">Derecho probatorio disciplinario</text>
<text x="58" y="125" class="sub" fill="#53665D">De la hipótesis a una valoración explicable y contradicha</text>
<path d="M90 188H1099" fill="none" stroke="#715BC0" stroke-width="3" stroke-linecap="round"/>
<g><rect x="58" y="205" width="252" height="225" rx="14" fill="#FFFFFF" stroke="#D7E6DF"/><rect x="58" y="205" width="252" height="5" rx="2.5" fill="#715BC0"/><circle cx="91" cy="243" r="17" fill="#E4F2EB"/><text x="91" y="249" text-anchor="middle" class="num" fill="#715BC0">1</text><text x="79" y="271" class="head">Hipótesis</text><text x="78" y="350" class="detail">Precisar qué hecho se pretende</text><text x="78" y="376" class="detail">demostrar</text></g><g><rect x="340" y="205" width="252" height="225" rx="14" fill="#FFFFFF" stroke="#D7E6DF"/><rect x="340" y="205" width="252" height="5" rx="2.5" fill="#715BC0"/><circle cx="373" cy="243" r="17" fill="#E4F2EB"/><text x="373" y="249" text-anchor="middle" class="num" fill="#715BC0">2</text><text x="361" y="271" class="head">Fuentes</text><text x="360" y="350" class="detail">Identificar testimonios,</text><text x="360" y="376" class="detail">documentos y soporte técnico</text></g><g><rect x="622" y="205" width="252" height="225" rx="14" fill="#FFFFFF" stroke="#D7E6DF"/><rect x="622" y="205" width="252" height="5" rx="2.5" fill="#715BC0"/><circle cx="655" cy="243" r="17" fill="#E4F2EB"/><text x="655" y="249" text-anchor="middle" class="num" fill="#715BC0">3</text><text x="643" y="271" class="head">Control</text><text x="642" y="350" class="detail">Legalidad, contradicción,</text><text x="642" y="376" class="detail">pertinencia y utilidad</text></g><g><rect x="904" y="205" width="252" height="225" rx="14" fill="#FFFFFF" stroke="#D7E6DF"/><rect x="904" y="205" width="252" height="5" rx="2.5" fill="#715BC0"/><circle cx="937" cy="243" r="17" fill="#E4F2EB"/><text x="937" y="249" text-anchor="middle" class="num" fill="#715BC0">4</text><text x="925" y="271" class="head">Valoración</text><text x="924" y="350" class="detail">Examen conjunto, límites y</text><text x="924" y="376" class="detail">decisión motivada</text></g>
<rect x="58" y="470" width="528" height="160" rx="12" fill="#ECF6F0" stroke="#C9E6D6"/><text class="small" x="79" y="506" fill="#715BC0">CLAVE PARA DECIDIR</text><text class="panel" x="79" y="542">Un registro auténtico no demuestra por sí solo</text><text class="panel" x="79" y="567">autoría ni culpabilidad.</text>
<rect x="610" y="470" width="532" height="160" rx="12" fill="#FFF7EC" stroke="#EEDFC9"/><text class="small" x="632" y="506" fill="#9E6B26">ERROR HABITUAL</text><text class="panel" x="632" y="542">Usar una fuente aislada como conclusión jurídica</text><text class="panel" x="632" y="567">definitiva.</text>
<text x="58" y="680" class="foot">Esquema pedagógico · complementa la lección; consulta las fuentes para conocer reglas, excepciones y términos.</text>
</svg>