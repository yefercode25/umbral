<title id="title">M53 · Inhabilidades, incompatibilidades y conflictos en contratación · Mapa de conceptos</title>
<desc id="desc">Esquema pedagógico del módulo 53 de Procuraduría, lección 1. Apoya el texto normativo, sin sustituirlo.</desc>
<style>
.bg{fill:#F8FBF9}.main{fill:#22372D}.title{font:700 29px Arial,sans-serif;fill:#22372D}.sub{font:17px Arial,sans-serif;fill:#556D62}
.eyebrow{font:700 14px Arial,sans-serif;letter-spacing:.8px;fill:#8B583A}.badge{font:700 14px Arial,sans-serif;fill:#8B583A}
.panelTitle{font:700 17px Arial,sans-serif;fill:#20372B}.body{font:16px Arial,sans-serif;fill:#3D5448}.bodySmall{font:15px Arial,sans-serif;fill:#3D5448}.foot{font:13px Arial,sans-serif;fill:#65766E}
</style>
<rect width="1000" height="620" rx="24" fill="#F8FBF9"/>
<rect width="1000" height="197" rx="24" fill="#FAF0E9"/>
<rect x="0" y="173" width="1000" height="24" fill="#FAF0E9"/>
<text x="46" y="42" class="eyebrow">UMBRAL · PROCURADURÍA · M53 / LECCIÓN 1</text>
<text x="46" y="94" class="title">Inhabilidades, incompatibilidades y conflictos en</text><text x="46" y="134" class="title">contratación</text>
<text x="46" y="171" class="sub">Tres ideas clave para reconocer el supuesto de aplicación</text>
<rect x="46" y="213" width="908" height="112" rx="12" fill="#FFFFFF" stroke="#D5E6DB"/>
<rect x="46" y="213" width="6" height="112" rx="3" fill="#8B583A"/>
<circle cx="84" cy="248" r="19" fill="#FAF0E9"/>
<text x="84" y="254" text-anchor="middle" class="badge">1</text>
<text x="118" y="243" class="body">Una restricción legal no puede crearse por analogía sancionatoria.</text><rect x="46" y="337" width="908" height="112" rx="12" fill="#FFFFFF" stroke="#D5E6DB"/>
<rect x="46" y="337" width="6" height="112" rx="3" fill="#8B583A"/>
<circle cx="84" cy="372" r="19" fill="#FAF0E9"/>
<text x="84" y="378" text-anchor="middle" class="badge">2</text>
<text x="118" y="367" class="body">El momento temporal de la relación puede ser determinante.</text><rect x="46" y="461" width="908" height="112" rx="12" fill="#FFFFFF" stroke="#D5E6DB"/>
<rect x="46" y="461" width="6" height="112" rx="3" fill="#8B583A"/>
<circle cx="84" cy="496" r="19" fill="#FAF0E9"/>
<text x="84" y="502" text-anchor="middle" class="badge">3</text>
<text x="118" y="491" class="body">Declarar y tramitar oportunamente un conflicto protege tanto la decisión como al servidor.</text>
<text x="46" y="598" class="foot">Ayuda visual de estudio; las reglas, excepciones y términos se verifican en las fuentes de la lección.</text>
</svg>