<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 375" width="890" height="375" role="img" aria-labelledby="title desc"><title id="title">M64: tres conceptos</title><desc id="desc">M64 / LECCIÓN 1. Conceptos del módulo Informe técnico informático</desc><style>.bg{fill:#12161D}.box{fill:#1C222C;stroke:#394350;stroke-width:1.5}.txt{font:500 17px 'Google Sans',Arial,sans-serif;fill:#F3F6F8}.small{font:500 15px 'Google Sans',Arial,sans-serif;fill:#A8B0BB}.bold{font:700 18px 'Google Sans',Arial,sans-serif;fill:#F3F6F8}.count{font:800 16px 'Google Sans',Arial,sans-serif;fill:#12161D}.warn{font:700 17px 'Google Sans',Arial,sans-serif;fill:#FB888A}</style><rect class="bg" width="890" height="375" rx="20"/><path d="M436 32 V63 M150 63 H722 M150 63 V85 M436 63 V85 M722 63 V85" stroke="#51CFBB" stroke-width="2.5" fill="none" stroke-linecap="round"/><rect class="box" x="20" y="85" width="260" height="270" rx="14"/><circle cx="48" cy="113" r="16" fill="#51CFBB"/><text x="48" y="119" text-anchor="middle" class="count">1</text><text x="40" y="163" class="txt">Metodología reproducible</text><text x="40" y="186" class="txt">vale más que una conclusión</text><text x="40" y="209" class="txt">categórica sin soporte.</text><rect class="box" x="306" y="85" width="260" height="270" rx="14"/><circle cx="334" cy="113" r="16" fill="#51CFBB"/><text x="334" y="119" text-anchor="middle" class="count">2</text><text x="326" y="163" class="txt">Anexos técnicos permiten</text><text x="326" y="186" class="txt">mantener el cuerpo principal</text><text x="326" y="209" class="txt">comprensible.</text><rect class="box" x="592" y="85" width="260" height="270" rx="14"/><circle cx="620" cy="113" r="16" fill="#51CFBB"/><text x="620" y="119" text-anchor="middle" class="count">3</text><text x="612" y="163" class="txt">Una limitación explícita</text><text x="612" y="186" class="txt">aumenta la confiabilidad</text><text x="612" y="209" class="txt">cuando refleja honestamente</text><text x="612" y="232" class="txt">el alcance del análisis.</text></svg>