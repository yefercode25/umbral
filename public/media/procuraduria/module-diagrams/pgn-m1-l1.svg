<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-labelledby="title desc">
<title id="title">M1 · Derecho para quien empieza desde cero · Mapa de conceptos</title>
<desc id="desc">Esquema pedagógico del módulo 1 de Procuraduría, lección 1. Apoya el texto normativo, sin sustituirlo.</desc>
<style>
.bg{fill:#F8FBF9}.main{fill:#22372D}.title{font:700 29px Arial,sans-serif;fill:#22372D}.sub{font:17px Arial,sans-serif;fill:#556D62}
.eyebrow{font:700 14px Arial,sans-serif;letter-spacing:.8px;fill:#276A5A}.badge{font:700 14px Arial,sans-serif;fill:#276A5A}
.panelTitle{font:700 17px Arial,sans-serif;fill:#20372B}.body{font:16px Arial,sans-serif;fill:#3D5448}.bodySmall{font:15px Arial,sans-serif;fill:#3D5448}.foot{font:13px Arial,sans-serif;fill:#65766E}
</style>
<rect width="1000" height="620" rx="24" fill="#F8FBF9"/>
<rect width="1000" height="197" rx="24" fill="#EBF6EF"/>
<rect x="0" y="173" width="1000" height="24" fill="#EBF6EF"/>
<text x="46" y="42" class="eyebrow">UMBRAL · PROCURADURÍA · M1 / LECCIÓN 1</text>
<text x="46" y="94" class="title">Derecho para quien empieza desde cero</text>
<text x="46" y="131" class="sub">Tres ideas clave para reconocer el supuesto de aplicación</text>
<rect x="46" y="213" width="908" height="112" rx="12" fill="#FFFFFF" stroke="#D5E6DB"/>
<rect x="46" y="213" width="6" height="112" rx="3" fill="#276A5A"/>
<circle cx="84" cy="248" r="19" fill="#EBF6EF"/>
<text x="84" y="254" text-anchor="middle" class="badge">1</text>
<text x="118" y="243" class="body">La Constitución es norma superior y marco de derechos y organización estatal.</text><rect x="46" y="337" width="908" height="112" rx="12" fill="#FFFFFF" stroke="#D5E6DB"/>
<rect x="46" y="337" width="6" height="112" rx="3" fill="#276A5A"/>
<circle cx="84" cy="372" r="19" fill="#EBF6EF"/>
<text x="84" y="378" text-anchor="middle" class="badge">2</text>
<text x="118" y="367" class="body">Competencia es habilitación jurídica; no se reemplaza por buena intención o experiencia.</text><rect x="46" y="461" width="908" height="112" rx="12" fill="#FFFFFF" stroke="#D5E6DB"/>
<rect x="46" y="461" width="6" height="112" rx="3" fill="#276A5A"/>
<circle cx="84" cy="496" r="19" fill="#EBF6EF"/>
<text x="84" y="502" text-anchor="middle" class="badge">3</text>
<text x="118" y="491" class="body">Expediente es memoria organizada de actuaciones y soportes, no una simple carpeta.</text>
<text x="46" y="598" class="foot">Ayuda visual de estudio; las reglas, excepciones y términos se verifican en las fuentes de la lección.</text>
</svg>