<title id="title">M70 · Responsabilidad con la Organización y Organización del Trabajo · Nivel B · Mapa de conceptos</title>
<desc id="desc">Esquema pedagógico del módulo 70 de Procuraduría, lección 1. Apoya el texto normativo, sin sustituirlo.</desc>
<style>
.bg{fill:#F8FBF9}.main{fill:#22372D}.title{font:700 29px Arial,sans-serif;fill:#22372D}.sub{font:17px Arial,sans-serif;fill:#556D62}
.eyebrow{font:700 14px Arial,sans-serif;letter-spacing:.8px;fill:#797041}.badge{font:700 14px Arial,sans-serif;fill:#797041}
.panelTitle{font:700 17px Arial,sans-serif;fill:#20372B}.body{font:16px Arial,sans-serif;fill:#3D5448}.bodySmall{font:15px Arial,sans-serif;fill:#3D5448}.foot{font:13px Arial,sans-serif;fill:#65766E}
</style>
<rect width="1000" height="620" rx="24" fill="#F8FBF9"/>
<rect width="1000" height="197" rx="24" fill="#F9F6EA"/>
<rect x="0" y="173" width="1000" height="24" fill="#F9F6EA"/>
<text x="46" y="42" class="eyebrow">UMBRAL · PROCURADURÍA · M70 / LECCIÓN 1</text>
<text x="46" y="94" class="title">Responsabilidad con la Organización y Organización del</text><text x="46" y="134" class="title">Trabajo · Nivel B</text>
<text x="46" y="171" class="sub">Tres ideas clave para reconocer el supuesto de aplicación</text>
<rect x="46" y="213" width="908" height="112" rx="12" fill="#FFFFFF" stroke="#D5E6DB"/>
<rect x="46" y="213" width="6" height="112" rx="3" fill="#797041"/>
<circle cx="84" cy="248" r="19" fill="#F9F6EA"/>
<text x="84" y="254" text-anchor="middle" class="badge">1</text>
<text x="118" y="243" class="body">Cumplir metas no justifica vulnerar procedimiento.</text><rect x="46" y="337" width="908" height="112" rx="12" fill="#FFFFFF" stroke="#D5E6DB"/>
<rect x="46" y="337" width="6" height="112" rx="3" fill="#797041"/>
<circle cx="84" cy="372" r="19" fill="#F9F6EA"/>
<text x="84" y="378" text-anchor="middle" class="badge">2</text>
<text x="118" y="367" class="body">Organizar no significa rigidez absoluta frente a cambios justificados.</text><rect x="46" y="461" width="908" height="112" rx="12" fill="#FFFFFF" stroke="#D5E6DB"/>
<rect x="46" y="461" width="6" height="112" rx="3" fill="#797041"/>
<circle cx="84" cy="496" r="19" fill="#F9F6EA"/>
<text x="84" y="502" text-anchor="middle" class="badge">3</text>
<text x="118" y="491" class="body">Responsabilidad incluye alertar riesgos y asumir efectos de las propias decisiones.</text>
<text x="46" y="598" class="foot">Ayuda visual de estudio; las reglas, excepciones y términos se verifican en las fuentes de la lección.</text>
</svg>