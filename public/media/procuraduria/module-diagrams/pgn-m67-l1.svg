<text x="46" y="42" class="eyebrow">UMBRAL · PROCURADURÍA · M67 / LECCIÓN 1</text>
<text x="46" y="94" class="title">Análisis de datos para decidir</text>
<text x="46" y="131" class="sub">Tres ideas clave para reconocer el supuesto de aplicación</text>
<rect x="46" y="213" width="908" height="112" rx="12" fill="#FFFFFF" stroke="#D5E6DB"/>
<rect x="46" y="213" width="6" height="112" rx="3" fill="#8055A6"/>
<circle cx="84" cy="248" r="19" fill="#F5EFFB"/>
<text x="84" y="254" text-anchor="middle" class="badge">1</text>
<text x="118" y="243" class="body">Media puede distorsionarse por valores extremos.</text><rect x="46" y="337" width="908" height="112" rx="12" fill="#FFFFFF" stroke="#D5E6DB"/>
<rect x="46" y="337" width="6" height="112" rx="3" fill="#8055A6"/>
<circle cx="84" cy="372" r="19" fill="#F5EFFB"/>
<text x="84" y="378" text-anchor="middle" class="badge">2</text>
<text x="118" y="367" class="body">Porcentaje sin universo o denominador es una cifra incompleta.</text><rect x="46" y="461" width="908" height="112" rx="12" fill="#FFFFFF" stroke="#D5E6DB"/>
<rect x="46" y="461" width="6" height="112" rx="3" fill="#8055A6"/>
<circle cx="84" cy="496" r="19" fill="#F5EFFB"/>
<text x="84" y="502" text-anchor="middle" class="badge">3</text>
<text x="118" y="491" class="body">Correlación entre dos variables no prueba que una cause la otra.</text>
<text x="46" y="598" class="foot">Ayuda visual de estudio; las reglas, excepciones y términos se verifican en las fuentes de la lección.</text>
