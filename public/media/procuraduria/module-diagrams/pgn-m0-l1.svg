<title id="title">M0 · Tu empleo y la Convocatoria 104-2026 · Mapa de conceptos</title>
<desc id="desc">Esquema pedagógico del módulo 0 de Procuraduría, lección 1. Apoya el texto normativo, sin sustituirlo.</desc>
<style>
.bg{fill:#F8FBF9}.main{fill:#22372D}.title{font:700 29px Arial,sans-serif;fill:#22372D}.sub{font:17px Arial,sans-serif;fill:#556D62}
.eyebrow{font:700 14px Arial,sans-serif;letter-spacing:.8px;fill:#276A5A}.badge{font:700 14px Arial,sans-serif;fill:#276A5A}
.panelTitle{font:700 17px Arial,sans-serif;fill:#20372B}.body{font:16px Arial,sans-serif;fill:#3D5448}.bodySmall{font:15px Arial,sans-serif;fill:#3D5448}.foot{font:13px Arial,sans-serif;fill:#65766E}
