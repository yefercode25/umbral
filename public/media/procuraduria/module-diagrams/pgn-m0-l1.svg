<rect width="1000" height="620" rx="24" fill="#F8FBF9"/>
<rect width="1000" height="197" rx="24" fill="#EBF6EF"/>
<rect x="0" y="173" width="1000" height="24" fill="#EBF6EF"/>
<text x="46" y="42" class="eyebrow">UMBRAL · PROCURADURÍA · M0 / LECCIÓN 1</text>
<text x="46" y="94" class="title">Tu empleo y la Convocatoria 104-2026</text>
<text x="46" y="131" class="sub">Tres ideas clave para reconocer el supuesto de aplicación</text>
<rect x="46" y="213" width="908" height="112" rx="12" fill="#FFFFFF" stroke="#D5E6DB"/>
<rect x="46" y="213" width="6" height="112" rx="3" fill="#276A5A"/>
<circle cx="84" cy="248" r="19" fill="#EBF6EF"/>
<text x="84" y="254" text-anchor="middle" class="badge">1</text>
<text x="118" y="243" class="body">Conocimientos es eliminatoria, exige 65/100 y pesa 70 %; comportamentales 20 % y antecedentes 10 %.</text><rect x="46" y="337" width="908" height="112" rx="12" fill="#FFFFFF" stroke="#D5E6DB"/>
<rect x="46" y="337" width="6" height="112" rx="3" fill="#276A5A"/>
<circle cx="84" cy="372" r="19" fill="#EBF6EF"/>
<text x="84" y="378" text-anchor="middle" class="badge">2</text>
<text x="118" y="367" class="body">Las funciones 1, 4 y 5 convierten instrucción, prueba y despachos comisorios en núcleo prioritario.</text><rect x="46" y="461" width="908" height="112" rx="12" fill="#FFFFFF" stroke="#D5E6DB"/>
<rect x="46" y="461" width="6" height="112" rx="3" fill="#276A5A"/>
<circle cx="84" cy="496" r="19" fill="#EBF6EF"/>
<text x="84" y="502" text-anchor="middle" class="badge">3</text>
<text x="118" y="491" class="body">Tu título de Ingeniería de Sistemas es una puerta de entrada, pero el empleo sigue siendo</text><text x="118" y="513" class="body">multidisciplinario y jurídico-operativo.</text>
<text x="46" y="598" class="foot">Ayuda visual de estudio; las reglas, excepciones y términos se verifican en las fuentes de la lección.</text>
</svg>